name: Capture newest injury PDFs (07920bdc)

# Session arena/07920bdc-nba1, COORDINATION §56 / X02.
#
# A session runs in a sandbox whose only outbound path is the GitHub API, so it
# cannot write the *bytes* of an official injury PDF to disk. This workflow puts
# the fetch on a runner that has the network and commits the content-addressed
# PDFs back to this session's branch.
#
# Deliberately narrow:
#   * it runs only on this session's branch, and only when this file or the
#     capture script itself changes - so it cannot arm itself in a loop and it
#     cannot be armed by another session's push;
#   * the bot commit carries [skip ci], which does not trigger workflows;
#   * it touches nothing but data/raw/injury_pdfs/** (captures, owned by this
#     session's §56 scope) and verify/2026-11-16-07920bdc/** (its own record);
#   * the fetch script refuses any host other than official.nba.com and
#     ak-static.cms.nba.com.

on:
  push:
    branches: [arena/07920bdc-nba1]
    paths:
      - scripts/capture_injury_07920bdc.py
      - .github/workflows/capture-injury-07920bdc.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-injury-07920bdc
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch the newest official injury-report PDFs
        run: python3 scripts/capture_injury_07920bdc.py --max 12

      - name: Parse every archived edition and diff consecutive reports
        run: |
          python3 engine/injury_diff.py --pdf-dir data/raw/injury_pdfs \
            --out-dir data/parsed/injury_diffs 2>&1 | tail -80

      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/injury_pdfs data/parsed/injury_diffs verify/2026-11-16-07920bdc
          if git diff --cached --quiet; then
            echo "no new capture payloads - nothing committed"
            exit 0
          fi
          git commit -m "Capture newest official injury PDFs (07920bdc X02) [skip ci]"
          # Rebase in case the session pushed while the run was in flight; never
          # force, so another session's or the owner's work is never discarded.
          git pull --rebase origin arena/07920bdc-nba1
          git push origin HEAD:arena/07920bdc-nba1
