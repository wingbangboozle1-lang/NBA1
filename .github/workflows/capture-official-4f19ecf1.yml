name: Capture official evidence (4f19ecf1)

# COORDINATION.md arena/4f19ecf1-nba1 G02/G03. Runs scheduled every 4 minutes
# (auto-resume: each run fills the next unprobed slice of the injury clock grid
# and exits) and on push to its own paths so a script/workflow edit re-arms
# immediately. The platform reaps these jobs at ~80-100 s unpredictably, so a
# run does ONE small slice and commits it; the schedule resumes the rest.
on:
  push:
    branches: [arena/4f19ecf1-nba1]
    paths:
      - ".github/workflows/capture-official-4f19ecf1.yml"
      - "scripts/capture_official_4f19ecf1.py"
  schedule:
    - cron: "*/4 * * * *"

permissions:
  contents: write

concurrency:
  group: capture-official-4f19ecf1-d
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/4f19ecf1-nba1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch official gamebooks (stage 1)
        timeout-minutes: 1
        run: python3 scripts/capture_official_4f19ecf1.py --only gamebooks
      - name: Commit gamebooks
        if: always()
        continue-on-error: true
        run: |
          git add data/raw/session-4f19ecf1 data/official/gamebooks
          if ! git diff --cached --quiet; then
            git -c user.name="arena/4f19ecf1-nba1" -c user.email="arena-4f19ecf1@users.noreply.github.com" commit -m "Capture official NBA evidence: 11/17-18 gamebooks (4f19ecf1 G03) [skip ci]"
          fi
          git fetch origin arena/4f19ecf1-nba1
          git -c user.name="arena/4f19ecf1-nba1" -c user.email="arena-4f19ecf1@users.noreply.github.com" merge --no-edit origin/arena/4f19ecf1-nba1 || true
          git push origin HEAD:arena/4f19ecf1-nba1 || true
      - name: Injury grid slice (next 15 unprobed labels)
        continue-on-error: true
        timeout-minutes: 1
        run: GRID_NEXT=1 GRID_BATCH=15 python3 scripts/capture_official_4f19ecf1.py --only injury
      - name: Commit injury slice
        if: always()
        continue-on-error: true
        run: |
          git add data/raw/session-4f19ecf1 data/raw/injury_pdfs data/raw/_capture_injury_probe.json
          if ! git diff --cached --quiet; then
            git -c user.name="arena/4f19ecf1-nba1" -c user.email="arena-4f19ecf1@users.noreply.github.com" commit -m "Capture official NBA evidence: injury grid slice (4f19ecf1 G02) [skip ci]"
          fi
          git fetch origin arena/4f19ecf1-nba1
          git -c user.name="arena/4f19ecf1-nba1" -c user.email="arena-4f19ecf1@users.noreply.github.com" merge --no-edit origin/arena/4f19ecf1-nba1 || true
          git push origin HEAD:arena/4f19ecf1-nba1 || true
