name: Capture official gamebooks + newest injury editions (a374ec9f)

# Session arena/a374ec9f-nba1, COORDINATION §62 / A03 + A04.
#
# A session runs in a sandbox whose only outbound path is the GitHub API, so it
# cannot write the *bytes* of an official gamebook PDF or injury PDF to disk.
# This workflow puts the fetch on a runner that has the network and hands the
# captured payloads back as a workflow artifact.
#
# The artifact route (rather than a bot commit) is deliberate: a previous
# version of this workflow committed and pushed the captures from the runner
# and the push step failed on every run (the fetch itself succeeded). The
# session then downloads the artifact with the GitHub API and commits the
# files from the sandbox, where the commit is made by the session's own
# credential and can be reviewed.
#
# Deliberately narrow:
#   * it runs only on this session's branch, and only when this file or one of
#     the two capture scripts changes - so it cannot arm itself in a loop and
#     it cannot be armed by another session's push;
#   * it reads nothing from the repository except the two capture scripts and
#     the engine parser;
#   * both capture scripts refuse any host other than the official NBA hosts.

on:
  push:
    branches: [arena/a374ec9f-nba1]
    paths:
      - scripts/capture_gamebooks_a374ec9f.py
      - scripts/capture_injury_07920bdc.py
      - .github/workflows/capture-a374ec9f.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-a374ec9f
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The capture branch below is this session's own scratch branch: it is
          # created by this workflow and nothing else ever writes to it, so a
          # force push onto it cannot discard another session's work.
          ref: arena/a374ec9f-nba1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch the eight official 2026-11-16 gamebook PDFs
        run: |
          python3 scripts/capture_gamebooks_a374ec9f.py --date 2026-11-16 \
            --game 0022600245:ORL:BOS \
            --game 0022600246:CHI:CLE \
            --game 0022600247:MEM:WAS \
            --game 0022600248:PHI:BKN \
            --game 0022600249:HOU:MIA \
            --game 0022600250:POR:MIN \
            --game 0022600251:GSW:NOP \
            --game 0022600252:PHX:DEN

      - name: Fetch every injury edition the official index still lists
        run: |
          python3 scripts/capture_injury_07920bdc.py --max 80

      - name: Parse every archived edition and diff consecutive reports
        run: |
          python3 engine/injury_diff.py --pdf-dir data/raw/injury_pdfs \
            --out-dir data/parsed/injury_diffs 2>&1 | tail -60

      - name: Collect the captured payloads
        run: |
          mkdir -p payload/data/raw payload/data/parsed payload/verify
          cp -r data/raw/gamebooks payload/data/raw/ 2>/dev/null || true
          cp -r data/raw/injury_pdfs payload/data/raw/ 2>/dev/null || true
          cp -r data/parsed/injury_diffs payload/data/parsed/ 2>/dev/null || true
          cp -r verify/2026-11-17-a374ec9f payload/verify/ 2>/dev/null || true
          du -sh payload
          find payload -type f | wc -l

      - name: Upload the captured payloads
        uses: actions/upload-artifact@v4
        with:
          name: nba1-capture-a374ec9f
          path: payload
          retention-days: 14
          if-no-files-found: error

      - name: Publish the captured bytes to this session's capture branch
        run: |
          set -x
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "nba1-bot"
          git config user.email "nba1-bot@users.noreply.github.com"
          git checkout -B arena/a374ec9f-captures
          git add -A data/raw/gamebooks data/raw/injury_pdfs verify/2026-11-17-a374ec9f
          if git diff --cached --quiet; then
            echo "no new capture payloads - nothing to publish"
          else
            git commit -m "capture: official gamebooks + injury editions (a374ec9f) [skip ci]"
          fi
          # The branch is this workflow's own scratch branch; nothing else writes
          # to it, so this push cannot discard anyone else's work.
          git push --force origin HEAD:refs/heads/arena/a374ec9f-captures
