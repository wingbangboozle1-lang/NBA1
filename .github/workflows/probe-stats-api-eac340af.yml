name: Probe official stats API (eac340af)

# Session arena/eac340af-nba1, COORDINATION §69 I05 (flag F-CA-02, requirement R01).
#
# The scheduled refresh fetches five official NBA pages that render their team tables in the
# browser.  The fetched HTML therefore carries no team records and the parsers read 0 rows,
# which blocks the rebuild in engine/refresh_gate.py (it fails closed, correctly) and keeps the
# gated bet surface closed.  This workflow asks the only question that can be answered from a
# machine with the network: are the official stats endpoints behind those pages reachable, and
# do they return the rows the parsers need?
#
# Deliberately narrow, same shape as capture-official-e3d25abc.yml:
#   * runs only on this session's branch, and only when this file or the probe script changes;
#   * it cannot arm itself in a loop and cannot be armed by another session's push;
#   * the bot commit carries [skip ci], which does not trigger workflows;
#   * it writes only data/raw/session-eac340af/** and commits nothing else;
#   * the probe script refuses any host outside the official ones.

on:
  push:
    branches: [arena/eac340af-nba1]
    paths:
      - scripts/fetch_stats_api_eac340af.py
      - .github/workflows/probe-stats-api-eac340af.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-stats-api-eac340af
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe the official stats endpoints
        run: |
          python3 scripts/fetch_stats_api_eac340af.py --out data/raw/session-eac340af

      - name: Summarise the measurement
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("data/raw/session-eac340af/stats_api_probe_manifest.json"))
          print("attempted:", m["summary"]["attempted"])
          print("http 200  :", m["summary"]["http_200"])
          print("with rows :", m["summary"]["with_rows"])
          print("candidates that could close F-CA-02:")
          for k in m["summary"]["endpoints_that_could_close_fca_02"]:
              print("   ", k)
          for r in m["results"]:
              j = r.get("json") or {}
              print(f"   {r['key']}: status={r['http_status']} bytes={r['bytes']} "
                    f"rows={j.get('row_count')} err={r.get('error')}")
          PY

      - name: Commit the probe back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/session-eac340af
          if git diff --cached --quiet; then
            echo "no probe payload - nothing committed"
            exit 0
          fi
          git commit -m "Probe official stats endpoints (eac340af §69 I05) [skip ci]"
          git pull --rebase origin arena/eac340af-nba1
          git push origin HEAD:arena/eac340af-nba1

      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-api-probe-eac340af
          path: data/raw/session-eac340af/stats_api_probe_manifest.json
          if-no-files-found: warn
