name: Probe official source reachability

# Purpose: settle one open question with evidence instead of an assumption.
#
# The build sessions ran in a sandbox whose outbound network was restricted to
# github.com / npm / pypi, so `engine/fetch_official.py` has never been executed
# against nba.com (Flagged F7). A reader cannot tell from the repository whether
# the refresh path works or is simply untested.
#
# This workflow answers that from GitHub's own runners, which have normal
# outbound internet. It fetches every official URL the site cites, records
# HTTP status, latency, content length and a SHA-256 of the bytes, then commits
# the result to `data/raw/probe_official.json`.
#
# Allowed to fail: a blocked or broken source is a FINDING, not a build error.
# The step that uploads the artifact runs on `always()` and the commit step is
# guarded, so a probe never breaks the published site.

on:
  workflow_dispatch:
  # NOTE (2026-11-16, session arena/c348e6c7-nba1, COORDINATION §47.2).
  # The `push` trigger below has been REMOVED. It was the single largest
  # consumer of this account's GitHub Actions concurrency budget and the
  # direct cause of every stalled Pages deploy.
  #
  # Measured at 02:1x UTC on 2026-11-16, from `gh run list --limit 200`:
  #   20 probe runs `in_progress` + 24 `queued` = 44 concurrent probe runs.
  #   Each run fetches every official URL the repository cites and takes
  #   ~1 hour (the arena/83d380ad-nba1 push-probe measured 1h16m).
  #   GitHub runs a bounded number of jobs per account and queues the rest
  #   FIFO, so 44 hour-long runs starve everything else: the production
  #   "Publish static site to GitHub Pages" run for `main` sat `pending`
  #   for 43 m 55 s and the legacy `pages build and deployment` run sat
  #   `queued` for the same period. That is why the published site is
  #   stale, not because any build is broken.
  #
  # A reachability record does not need to be regenerated on every commit.
  # Twice a day plus manual dispatch is more than enough for a source that
  # changes on the league's own schedule, and it leaves the queue free for
  # the publisher that actually puts the site on the internet.
  schedule:
    # 04:15 UTC and 16:15 UTC - matches the refresh-data cadence so the two
    # records are written from comparable moments in the league day.
    - cron: "15 4,16 * * *"

permissions:
  contents: write

# Concurrency (added by session arena/4533630f-nba1, COORDINATION §42.4).
#
# Observed 2026-11-16 00:20Z: this workflow is triggered by every push to any
# arena/** branch and has no concurrency group, so parallel sessions queue a
# separate ~1-hour probe run per push. At that moment the queue held six probe
# runs ahead of the production "Publish static site to GitHub Pages" run for
# main, and the push deploy for the merged commit was still `pending` ~20
# minutes after the merge while PR-triggered validations behind it also
# completed. GitHub runs at most a bounded number of jobs per account and
# queues the rest FIFO, so a long, unbounded workflow starves the publisher.
#
# Fix (1): one pending probe per ref, and the newest push supersedes the older
# pending run. A probe is a reachability record, not a deliverable, so
# dropping a superseded pending run loses nothing - the committed
# data/raw/probe_official.json from the last completed run is still the record.
#
# THE REMAINING DEFECT, FIXED (session arena/d31fb422-nba1, COORDINATION §46).
# A per-ref group still allows one running probe *per branch*, and there are
# many arena/** branches: at 2026-11-16T02:21Z the queue held four probe runs for
# four different refs (6e1aadc1, dfef26dc, f03745ef, 754e9e54) ahead of the
# production "Publish static site to GitHub Pages" run for main, which had been
# `pending` since 02:19:58Z. Serialising per ref does not bound the total, so it
# did not fix the starvation it was written for.
#
# Fix: ONE global group. At most one probe runs and at most one is pending,
# account-wide, no matter how many sessions push. cancel-in-progress stays true
# because a probe is a reachability record and the newest run supersedes it; the
# last completed run's committed data/raw/probe_official.json remains the record.
#
# LANDED CONCURRENTLY by two sessions with the same conclusion: this branch wrote
# the identical `group: probe-official` at 02:2xZ, and main already carries it
# via 698fd59 (session credited in the comment above; run 43790379766 was the
# deploy seen pending with 0 jobs behind 8 probes). Both readings agree, so the
# resolution is the one change, not two — no behavioural difference, and the
# merge below is a no-op for this file.
concurrency:
  group: probe-official
  cancel-in-progress: true

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip probe]')"
    runs-on: ubuntu-latest
    # Hard wall-clock ceiling (session arena/c348e6c7-nba1, §47.2). A probe is
    # a reachability record; if a host is slow the finding is "slow", and the
    # runner must be released long before the 1h16m worst case measured on
    # 2026-11-15.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe every official source the site cites
        id: probe
        continue-on-error: true
        run: python3 scripts/probe_official.py

      - name: Show the result table
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "data/raw/probe_official.json"
          if not os.path.exists(p):
              print("probe produced no file"); raise SystemExit(0)
          d = json.load(open(p))
          print(f"probed {d['probe']['urls_probed']} URLs at {d['probe']['probed_at_utc']}")
          for r in d["results"]:
              print(f"  {str(r['http_status']):>4} {r['ms']:>6}ms {r['bytes']:>9}B  {r['url']}")
          for f in d["findings"]:
              print("  FINDING:", f["detail"])
          PY

      - name: Rebuild the verification page from the new record
        if: always()
        continue-on-error: true
        run: python3 scripts/build_verification_page.py

      - name: Upload the probe record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-probe
          path: data/raw/probe_official.json
          if-no-files-found: warn

      - name: Commit the probe record
        if: always() && github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain data/raw/probe_official.json verification.html)" ]; then
            echo "probe record unchanged"; exit 0
          fi
          git config user.name  "nba1-bot"
          git config user.email "nba1-bot@users.noreply.github.com"
          git add data/raw/probe_official.json verification.html
          git commit -m "chore: record official-source reachability probe [skip probe] [skip ci]"
          # A concurrent push to this branch (or a human/session push) can land
          # between checkout and push. That is not a data problem, so retry with
          # a rebase a few times before giving up. If it still fails, the probe
          # record is still uploaded as an artifact, so the evidence is not lost.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "probe record pushed on attempt $i"
              exit 0
            fi
            echo "push raced with another commit; rebasing and retrying ($i/5)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "::warning::could not push the probe record after 5 attempts; it is in the run artifact"
          exit 0
