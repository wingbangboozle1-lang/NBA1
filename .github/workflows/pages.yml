name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The previous global group (`pages`) was shared by every run. A main
  # deployment was cancelled while PR validation ran, although causation was
  # not established. Isolate PRs by number and serialize production runs by ref.
  # (Taken over verbatim from PR #65 / session arena/2dc33eb3-nba1 with credit —
  # their claim was >60 min without commits when carried here; see §27.4.)
  #
  # SG23 (board F53, recorded 2026-11-14 by arena/95c1cb23-nba1 after the
  # 688fd2d and 51015c6 deploys were cancelled by the next push): production
  # deploys must never cancel each other — cancel-in-progress only inside a
  # PR's own group. Every push to main now completes its deploy; the last
  # one to finish wins and the site always converges to a real head.
  # (Implemented verbatim as suggested; session arena/140a10aa-nba1.)
  #
  # Re-fixed by session arena/d31fb422-nba1 (COORDINATION §46). Keying production
  # runs by `github.ref` gives every branch its own "production" slot, so PR
  # validations on many arena/** branches deployed concurrently and displaced
  # each other: the pushes for f6b7676 (01:24Z), 0dfdf00 (01:02Z), 21e5c77
  # (02:16Z) and 2c7d13f (02:19Z) were all `cancelled`. Two groups now:
  #   pages-deploy  - every production push to main, serialised, never cancelled
  #                   (SG23 holds: a main deploy is never cancelled by the next push)
  #   pages-pr-<n>  - PR validation, cancellable, isolated per PR
  # `cancel-in-progress: false` on production is the point: the deploy that runs
  # is the newest queued one, and each still completes rather than being killed.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate site links and source coverage (build A)
        run: python3 scripts/check_site.py

      - name: Validate build B site data
        run: |
          python3 - <<'PY'
          import json, os, sys
          need = ["meta.json","sources.json","teams.json","lines.json","picks.json",
                  "props.json","injuries.json","gameflow.json","backtest.json",
                  "validation.json","leaderboard.json","correlations.json","luck.json",
                  "flagged.json","questions.json","suggestions.json","executive.json"]
          missing = [f for f in need if not os.path.exists(os.path.join("docs","data",f))]
          if missing:
              print("MISSING site data:", missing); sys.exit(1)
          for f in need:
              with open(os.path.join("docs","data",f)) as fh:
                  json.load(fh)
          print("All build-B site data files present and valid JSON.")
          PY

      - name: Independent integration verification
        run: python3 scripts/verify_integration.py

      # Added by session arena/2823d556-nba1 (COORDINATION §47.1), implementing
      # the open cross-session request logged at the end of §42.5.
      #
      # Why it is needed, in the words of the finding it comes from: R-42-B was
      # a `<span>` substituted into an `href`, which produced a broken internal
      # link on site/pages/injuries.html. `verify_integration.py` passed on
      # `main` while it was broken; only `verify_all.py` caught it. CI did not
      # run verify_all.py, so the defect was one merge away from the live site.
      # A gate that exists in the repository but is absent from CI is not a
      # gate.
      - name: Row-level provenance and link audit (verify_all)
        run: python3 scripts/verify_all.py

      - name: Render every page in a headless DOM
        run: |
          npm install --no-save jsdom >/dev/null 2>&1
          node scripts/render_check.mjs

      - name: Probe record present and valid
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = "data/raw/probe_official.json"
          if not os.path.exists(p):
              print("no probe record; skipping (the probe workflow writes it)")
              raise SystemExit(0)
          d = json.load(open(p))
          assert d["probe"]["urls_probed"] == len(d["results"]), "probe count mismatch"
          print("probe record:", d["probe"]["urls_probed"], "URLs,", d["probe"]["probed_at_utc"])
          PY

      - name: Regenerate the verification page and require it to be current
        run: |
          python3 scripts/build_verification_page.py
          if [ -n "$(git status --porcelain verification.html)" ]; then
            echo "verification.html is stale - regenerate and commit it"
            exit 1
          fi

      - name: Validate the Command Center renders every page from its data
        run: |
          python3 - <<'PY'
          import json, os, sys
          need = ["meta.json","sources.json","lines.json","picks.json","props.json",
                  "injuries.json","gameflow.json","backtest.json","validation.json",
                  "leaderboard.json","correlations.json","luck.json","teams.json",
                  "flagged.json","questions.json","suggestions.json","executive.json",
                  "repo-review.json"]
          d = os.path.join("command-center", "data")
          missing = [f for f in need if not os.path.exists(os.path.join(d, f))]
          if missing:
              print("MISSING Command Center data:", missing); sys.exit(1)
          for f in need:
              with open(os.path.join(d, f)) as fh:
                  json.load(fh)
          pages = [f for f in os.listdir("command-center") if f.endswith(".html")]
          if len(pages) != 17:
              print("Expected 17 Command Center pages, found", len(pages)); sys.exit(1)
          print(f"Command Center: {len(need)} data files valid, {len(pages)} pages present.")
          PY

      - name: Static link and source check across every build
        run: python3 scripts/check_links.py

      - name: Execute every Command Center page against its data
        run: python3 scripts/check_rendered.py

      - name: Check for broken internal links (both builds)
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "."
          pages = []
          for dirpath, _, files in os.walk(root):
              if ".git" in dirpath.split(os.sep):
                  continue
              for f in files:
                  if f.endswith(".html"): pages.append(os.path.join(dirpath, f))
          bad = []
          for p in pages:
              html = open(p, encoding="utf-8").read()
              # strip <script> blocks: their string literals are not links
              html = re.sub(r"<script\b.*?</script>", "", html, flags=re.S | re.I)
              base = os.path.dirname(p)
              for m in re.finditer(r'(?:href|src)="([^"#][^"]*)"', html):
                  h = m.group(1)
                  if re.match(r'^(https?:|mailto:|//)', h): continue
                  # strip the #fragment before the existence check (deep anchors like
                  # pages/flagged.html#F2 are legitimate; scripts/verify_all.py 4e already
                  # strips the fragment — this scan did not, so PR #40's anchor links
                  # tripped it. Session arena/697fca1e-nba1, I-W10.)
                  target = os.path.normpath(os.path.join(base, h.split("#")[0]))
                  if not os.path.exists(target):
                      bad.append((p, h, target))
          if bad:
              for b in bad: print("BROKEN:", b)
              sys.exit(1)
          print(f"Checked {len(pages)} pages, no broken internal links.")
          PY

  # SINGLE DEPLOY PATH (SG37 / GR4.2), fixed 2026-11-16T15:0xZ by session
  # arena/0e9c924f-nba1 (COORDINATION §50):
  #
  # GitHub Pages was configured build_type=legacy, so every push to main made
  # GitHub's legacy builder publish the site WHILE this workflow's deploy job
  # pushed a second artifact at the same environment. The measurable symptom
  # (board F53 / F80-F86 line of findings): nine consecutive "pages build and
  # deployment" runs cancelled, one per push, each killed by the next.
  #
  # The intended fix is `PUT /repos/.../pages -F build_type=workflow` followed
  # by keeping this deploy job. That PUT was attempted from this session and
  # measured to fail: HTTP 403 {"message":"Resource not accessible by
  # integration"} - the token behind this session (GitHub App installation of
  # wingbangboozle1-lang) has no pages:write, recorded as flag F127 (renumbered from F116 at merge). One
  # deploy path is still required TODAY, so the reachable half is applied:
  # this workflow keeps its full validation battery but no longer publishes
  # artifacts, leaving the Pages legacy builder (which successfully published
  # 047103e at 11:51:43Z) as the only publisher.
  #
  # To hand the deploy back to Actions later: (1) grant the app pages:write or
  # run the PUT from an admin session (build_type=workflow), (2) restore the
  # four configure/upload/deploy steps removed here. Until then, do NOT add a
  # second publisher - SG37's whole point is one writer of one site.
  deploy-disabled:
    if: false && github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
