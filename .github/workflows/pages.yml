name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate site links and source coverage (build A)
        run: python3 scripts/check_site.py

      - name: Validate build B site data
        run: |
          python3 - <<'PY'
          import json, os, sys
          need = ["meta.json","sources.json","teams.json","lines.json","picks.json",
                  "props.json","injuries.json","gameflow.json","backtest.json",
                  "validation.json","leaderboard.json","correlations.json","luck.json",
                  "flagged.json","questions.json","suggestions.json","executive.json"]
          missing = [f for f in need if not os.path.exists(os.path.join("docs","data",f))]
          if missing:
              print("MISSING site data:", missing); sys.exit(1)
          for f in need:
              with open(os.path.join("docs","data",f)) as fh:
                  json.load(fh)
          print("All build-B site data files present and valid JSON.")
          PY

      - name: Independent integration verification
        run: python3 scripts/verify_integration.py

      - name: Render every page in a headless DOM
        run: |
          npm install --no-save jsdom >/dev/null 2>&1
          node scripts/render_check.mjs

      - name: Probe record present and valid
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = "data/raw/probe_official.json"
          if not os.path.exists(p):
              print("no probe record; skipping (the probe workflow writes it)")
              raise SystemExit(0)
          d = json.load(open(p))
          assert d["probe"]["urls_probed"] == len(d["results"]), "probe count mismatch"
          print("probe record:", d["probe"]["urls_probed"], "URLs,", d["probe"]["probed_at_utc"])
          PY

      - name: Regenerate the derived verification page
        run: |
          # verification.html is derived from data/raw/probe_official.json. The
          # probe runs on its own schedule and commits asynchronously, so a
          # committed copy can legitimately lag by one run. Regenerating it here
          # means the deployed page always matches the committed evidence, and a
          # timestamp race can never fail the build. Deliberately not a staleness
          # assertion: that turned a correct gate into a flaky one.
          python3 scripts/build_verification_page.py

      - name: Check for broken internal links (both builds)
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "."
          pages = []
          for dirpath, _, files in os.walk(root):
              if ".git" in dirpath.split(os.sep):
                  continue
              for f in files:
                  if f.endswith(".html"): pages.append(os.path.join(dirpath, f))
          bad = []
          for p in pages:
              html = open(p, encoding="utf-8").read()
              # strip <script> blocks: their string literals are not links
              html = re.sub(r"<script\b.*?</script>", "", html, flags=re.S | re.I)
              base = os.path.dirname(p)
              for m in re.finditer(r'(?:href|src)="([^"#][^"]*)"', html):
                  h = m.group(1)
                  if re.match(r'^(https?:|mailto:|//)', h): continue
                  target = os.path.normpath(os.path.join(base, h))
                  if not os.path.exists(target):
                      bad.append((p, h, target))
          if bad:
              for b in bad: print("BROKEN:", b)
              sys.exit(1)
          print(f"Checked {len(pages)} pages, no broken internal links.")
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
