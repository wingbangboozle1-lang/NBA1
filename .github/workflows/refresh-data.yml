name: Refresh official data

# Purpose: keep the official capture layer alive, and settle Flagged F7
# ("this refresh path has never been executed") with an executed run instead
# of an assumption.
#
# Design rules (see also engine/fetch_official.py):
#   * only official NBA hosts are fetched, with the web-client header set the
#     reachability probe proved returns HTTP 200 (data/raw/probe_official.json);
#   * captures are written as data/raw/_capture_*.json and injury PDFs are
#     archived by content hash under data/raw/injury_pdfs/; committed model
#     snapshots are never overwritten - promotion requires re-verification;
#   * the builder runs only after a current-run source digest, freshness, PDF
#     integrity and verified-promotion gate passes; otherwise it is skipped;
#   * a scheduled run can no longer push to `main` directly (cross-session
#     request R7 / audit item I-01): it opens a pull request instead, so a
#     human or session reviews captures before they land;
#   * a run that sees nothing new publishes nothing - no timestamp-only
#     commits;
#   * a data problem must never break the published site: fetch and build are
#     continue-on-error, and the run record is uploaded as an artifact.
#
# NOTE: pull requests created with the default GITHUB_TOKEN do not trigger
# workflows (GitHub's recursion guard), so CI does not run on an auto-refresh
# PR. The PR body carries this job's own check results instead, and merging
# the PR to main triggers the normal Publish-static-site workflow.

on:
  schedule:
    # 11:15 UTC, 15:15 UTC and 22:15 UTC - after the league's own report times
    - cron: "15 11,15,22 * * *"
  workflow_dispatch:
  # Fallback trigger: workflow_dispatch needs actions:write, which the
  # session tokens do not have (HTTP 403 on the dispatch API, observed
  # 2026-11-14). A push that changes the fetch script or this workflow runs
  # the refresh instead. Loop-safe: the publish step commits with
  # [skip ci], which does not trigger workflows, and neither of these two
  # paths is ever written by the bot itself.
  push:
    branches: ["arena/**"]
    paths:
      - engine/fetch_official.py
      - engine/parse_official.py
      - engine/promote_official.py
      - engine/injury_diff.py
      - .github/workflows/refresh-data.yml

permissions:
  contents: write
  pull-requests: write

# Concurrency + timeout (session arena/c348e6c7-nba1, COORDINATION §47.2).
# Same starvation class as the probe workflow: this workflow also triggers on
# every push to any `arena/**` branch, and with parallel sessions pushing, each
# push armed another run. One slot, newest wins, and a hard 30-minute ceiling.
#
# KEPT ON TOP OF PR #117 (session arena/abac961f-nba1): #117 was branched before
# this block existed, so carrying its version of the file verbatim would have
# silently dropped the fix. Both sides are wanted - their promote step, this
# queue protection.
concurrency:
  group: refresh-official-global
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Capture first. Builders must never run against stale/changed snapshots.
      - name: Fetch official sources
        id: fetch
        continue-on-error: true
        run: python3 engine/fetch_official.py

      # RFG4 (COORDINATION.md section 38/42): re-validate every parsed row,
      # cross-check the official standings page against the team-traditional
      # page, and write digest-bound promotion records. Fail-closed: anything
      # unprovable stays in `changed` and the gate below blocks the rebuild.
      - name: Promote verified structured inputs (fail-closed)
        id: promote
        # Promotion also runs after a completed fetch attempt that returned
        # non-zero: an injury PDF may have been captured even when unrelated
        # client-rendered sources fail parsing. The rebuild remains strictly
        # gated on fetch success and the freshness gate below, so this only
        # refreshes verified evidence; it cannot publish stale model inputs.
        if: always() && steps.fetch.outcome != 'cancelled' && steps.fetch.outcome != 'skipped'
        continue-on-error: true
        run: python3 engine/promote_official.py

      - name: Require fresh provenance and verified-promotion gates
        id: freshness
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python3 engine/refresh_gate.py --max-age-hours 10
          echo "gate_exit=$?"
          # Publish the decision even when it blocks: a green gate that ran on a
          # declared-unreadable source must be distinguishable from a green gate
          # that ran on fresh promoted data (COORDINATION.md section 69).
          python3 - <<'PY'
          import json, os
          p = "data/raw/_capture_gate_report.json"
          if os.path.exists(p):
              d = json.load(open(p))
              for entry in d.get("declarations_applied", []):
                  print(f"::warning title=Gate passed by declaration::"
                        f"{entry['source_key']} unreadable until "
                        f"{entry['expires_at_utc']} (evidence {entry['evidence']})")
          PY
          exit 0

      # A changed raw capture is only evidence; it is not a promotion into the
      # model inputs. The gate blocks rebuilding until changes are verified and
      # promoted. A clean current capture set may rebuild committed inputs.
      - name: Rebuild only after all freshness and provenance gates pass
        id: build
        # Defense in depth: a green freshness output is necessary, but so is
        # successful completion of the promotion step that writes the verified
        # inputs. Neither continue-on-error step may be treated as a pass merely
        # because the workflow itself continues to settlement and reporting.
        if: steps.fetch.outcome == 'success' && steps.promote.outcome == 'success' && steps.freshness.outcome == 'success' && steps.freshness.outputs.ok == 'true'
        continue-on-error: true
        run: |
          python3 engine/pipeline.py
          python3 engine/build_site.py

      # Settlement is part of the scheduled job, not a manual step (brief:
      # "Settle the sealed ledger from official finals as soon as each game day
      # ends"; register item R19/R03). For every archived pre-tip slate this
      # tries to settle each date; a date settles only if EVERY game on the
      # official results feed is verified final (quarters sum to the printed
      # final). A date with a live or missing game is left open, never guessed.
      # Exit 3 ("nothing settleable") is success for this step.
      - name: Settle every game day that has ended (official finals only)
        id: settle
        continue-on-error: true
        run: |
          set -u
          python3 - <<'PY' > /tmp/slates.txt
          import glob, json, os, re
          starts = set()
          for p in glob.glob("data/archive/horizon_picks_*.json"):
              m = re.search(r"horizon_picks_(\d{4}-\d{2}-\d{2})\.json$", p)
              if m:
                  starts.add(m.group(1))
          print("\n".join(sorted(starts)))
          PY
          rc_all=0
          while read -r slate; do
            [ -z "${slate}" ] && continue
            echo "=== slate ${slate} ==="
            python3 scripts/settle_slate.py --slate "${slate}" --by "scheduled settle (refresh-data.yml)"
            rc=$?
            if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 3 ]; then rc_all=1; fi
          done < /tmp/slates.txt
          python3 scripts/verify_ledger.py || rc_all=1
          exit "${rc_all}"

      - name: Report why rebuilding was blocked
        if: always() && steps.build.outcome == 'skipped'
        run: |
          echo "::warning::Scheduled rebuild was skipped because fetch or freshness/provenance/promotion gates did not pass."
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            python3 engine/refresh_gate.py --max-age-hours 10 || true
          else
            echo "Fetch step outcome: ${{ steps.fetch.outcome }}"
          fi

      - name: Discard generated-site churn only
        if: always() && steps.build.outcome != 'skipped'
        run: git checkout -- docs/data docs/b || true

      - name: Record the run
        run: |
          python3 - <<'PY'
          import json, os, datetime
          p = os.path.join("data", "raw", "_last_refresh.json")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          s = json.load(open(p)) if os.path.exists(p) else {}
          s["workflow_run_at_utc"] = now
          s["workflow_ref"] = "${{ github.ref }}"
          s["fetch_outcome"] = "${{ steps.fetch.outcome }}"
          s["promote_outcome"] = "${{ steps.promote.outcome }}"
          s["freshness_outcome"] = "${{ steps.freshness.outcome }}"
          s["freshness_ok"] = "${{ steps.freshness.outputs.ok }}"
          s["settlement_outcome"] = "${{ steps.settle.outcome }}"
          s["build_outcome"] = "${{ steps.build.outcome }}"
          json.dump(s, open(p, "w"), indent=1)
          print(json.dumps(s, indent=1))
          PY

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-run-record
          path: data/raw/_last_refresh.json
          if-no-files-found: warn

      - name: Upload the captures (survives a failed push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-captures
          path: |
            data/raw/_capture_*.json
            data/raw/injury_pdfs/**
          if-no-files-found: warn

      - name: Publish captures (pull request from main, direct commit on session branches)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -u
          git config user.name  "nba1-bot"
          git config user.email "nba1-bot@users.noreply.github.com"

          # Stage only capture payloads and content-addressed injury PDFs.
          # _last_refresh.json rides along only when evidence changes, so a
          # no-change run produces no timestamp-only commit.
          # Settlement output is evidence, not a snapshot: it may land in the
          # same PR when a game day ended during this run.
          #
          # Staging goes through scripts/stage_publish.py, path by path
          # (COORDINATION.md section 77.1): `git add a.json missing.json`
          # stages NOTHING and hides the error behind `2>/dev/null || true`,
          # which is how every verified promotion of every scheduled run was
          # silently discarded while the run record claimed `promoted` -
          # `data/raw/standings.json` has never existed, and its absence
          # aborted the whole batch. One missing file must never cost the
          # rest of the evidence again.
          python3 scripts/stage_publish.py evidence

          # Also stage the digest-bound promotion records and computed diffs
          # produced by the promote step (carried from PR #117, arena/abac961f-nba1),
          # plus the source register the promoter updates and the rebuild's
          # own committed outputs (pipeline's docs/data churn is discarded by
          # design; these are what it actually publishes).
          python3 scripts/stage_publish.py promoted
          if [ "${BUILD_OUTCOME}" = "success" ]; then
            python3 scripts/stage_publish.py derived
          fi
          if git diff --cached --quiet; then
            echo "No new capture payloads - nothing to publish."
            exit 0
          fi
          python3 scripts/stage_publish.py record

          # Evidence for the pull request body: the run record plus this
          # job's own site check (CI does not run on token-created PRs).
          python3 - <<'PY'
          import json, os, subprocess
          p = os.path.join("data", "raw", "_last_refresh.json")
          s = json.load(open(p)) if os.path.exists(p) else {}
          check = subprocess.run(["python3", "scripts/check_site.py"],
                                 capture_output=True, text=True)
          changed = ", ".join(s.get("changed", [])) or "(none)"
          failed = "; ".join(f"{k}: {v}" for k, v in s.get("failed", [])) or "(none)"
          check_tail = (check.stdout + check.stderr).strip()[-1500:]
          body = (
              "## Automated official-data refresh (captures + verified promotions)\n\n"
              "Opened by the `Refresh official data` workflow. Parsed rows "
              "land in `data/raw/_capture_*.json`; only rows that "
              "`engine/promote_official.py` re-validated and digest-bound are "
              "promoted into the committed inputs (with a `verification` "
              "block naming the exact official response). Anything unprovable "
              "was left unpromoted and blocked the rebuild.\n\n"
              "### Run record\n\n"
              f"- run at (UTC): {s.get('workflow_run_at_utc')}\n"
              f"- ref: {s.get('workflow_ref')}\n"
              f"- fetch step: {s.get('fetch_outcome')}\n"
              f"- promotion step: {s.get('promote_outcome')}\n"
              f"- freshness step: {s.get('freshness_outcome')}\n"
              f"- freshness gate `ok`: {s.get('freshness_ok')}\n"
              f"- settlement step: {s.get('settlement_outcome')}\n"
              f"- build step: {s.get('build_outcome')}\n"
              f"- captures changed: {changed}\n"
              f"- problems: {failed}\n"
              f"- `scripts/check_site.py` exit: {check.returncode}\n\n"
              "```\n" + check_tail + "\n```\n\n"
              "### Review before merging\n\n"
              "- **A FAILING FRESHNESS/PROVENANCE GATE BLOCKS PROMOTION**: do not\n"
              "  rebuild or promote from this run until the listed failures are fixed.\n"
              "- Diff each changed capture against the official URL recorded inside it.\n"
              "- Promote a row into a committed snapshot only after re-checking it on\n"
              "  the official page - never from this PR alone.\n"
              "- CI does not run on this PR: GitHub does not trigger workflows from the\n"
              "  default `GITHUB_TOKEN` (recursion guard). Merging to `main` runs the\n"
              "  normal Publish-static-site workflow.\n"
          )
          open("/tmp/pr_body.md", "w").write(body)
          print(body)
          PY

          MSG="chore: refresh official data - captures + verified promotions [skip probe] [skip ci]"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # Scheduled run: never push to main directly (R7 / I-01).
            BRANCH="auto/refresh-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "${BRANCH}"
            git commit -m "${MSG}"
            git push -u origin "${BRANCH}" || { echo "::warning::push of ${BRANCH} failed; captures are in the run artifact"; exit 0; }
            gh pr create --base main --head "${BRANCH}" \
              --title "chore(refresh): official captures $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body-file /tmp/pr_body.md \
              || echo "::warning::gh pr create failed; captures are on branch ${BRANCH} and in the run artifact"
            exit 0
          fi

          # Manual run from a session branch: commit to that branch directly,
          # with the push-retry pattern proven in probe-official.yml.
          git commit -m "${MSG}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "captures pushed on attempt $i"
              exit 0
            fi
            echo "push raced with another commit; rebasing and retrying ($i/5)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "::warning::could not push the captures after 5 attempts; they are in the run artifact"
          exit 0
